version: "2"

run:
  issues-exit-code: 1

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  default: none
  exclusions:
    presets: []
    paths:
      - '\.cache'
      - '^var/'
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gosec
          - dupl
          - funlen
          - errchkjson
          - depguard
          - govet
          - prealloc
          - gocritic
      # A generator legitimately opens its own declared output and rolls back a
      # half-written skeleton in the user-chosen init directory; both paths are
      # constructed by whyor, not taken from remote input.
      - path: 'internal/gen/output\.go'
        linters:
          - gosec
        text: 'G304'
      - path: 'cmd/whyor/init\.go'
        linters:
          - gosec
        text: 'G304|G703'
  enable:
    - errcheck
    # gosimple is merged into staticcheck in golangci-lint v2.
    - govet
    - ineffassign
    - staticcheck
    - unused
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - cyclop
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - funlen
    - gocognit
    - gocritic
    - gosec
    - maintidx
    - makezero
    - musttag
    - nestif
    - nilerr
    - noctx
    - nosprintfhostport
    - prealloc
    - spancheck
    - tagalign
    - wrapcheck
    - zerologlint
  settings:
    errcheck:
      check-blank: true
      disable-default-exclusions: true
      exclude-functions:
        # In-memory writers document that their writes always return nil.
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).Write
        - (*strings.Builder).WriteString
        - fmt.Fprintf(*bytes.Buffer)
        - fmt.Fprintf(*strings.Builder)
        - fmt.Fprint(*bytes.Buffer)
        - fmt.Fprint(*strings.Builder)
    gocognit:
      min-complexity: 30
    cyclop:
      max-complexity: 15
    funlen:
      lines: 60
      statements: 40
    nestif:
      min-complexity: 5
    exhaustive:
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/Medzoner/whyor)

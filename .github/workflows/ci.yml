name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check returned errors
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: -c .golangci.yml --timeout=5m
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/whyor check ./...
      - run: go run ./cmd/whyor unused ./...
      - name: Verify showcase demo
        env:
          DEMO_PAUSE: "0"
        run: bash docs/demo/run.sh

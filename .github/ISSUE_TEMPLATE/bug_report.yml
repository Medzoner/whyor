name: Bug report or migration blocker
description: Report a reproducible generation, CLI or Wire-migration problem.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying whyor. A small reproducer helps much more than a private application dump.
        Remove tokens, passwords, personal data and sensitive local paths before posting.
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Paste the output of go version. Also mention the Go version used to build whyor if different.
      placeholder: go version go1.27.1 linux/amd64
    validations:
      required: true
  - type: input
    id: whyor-version
    attributes:
      label: whyor version
      description: Release tag, installed version, or source commit.
      placeholder: v0.11.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include provider signatures, the injector, build tags and the exact command. Use a small public module if possible.
      placeholder: Paste a minimal example rather than your full application.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the complete relevant error and whether generated Go fails to compile.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed credentials and private application data from this report.
          required: true
